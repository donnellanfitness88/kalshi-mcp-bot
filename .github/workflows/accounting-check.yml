
name: Accounting Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounting-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run all accounting tests
        
        
        run: node --test tests/unit/accounting.test.js tests/unit/combined-accounting.test.js tests/unit/fill-reconciliation.test.js tests/unit/normalize-fills.test.js tests/unit/settlement-reconciliation.test.js


